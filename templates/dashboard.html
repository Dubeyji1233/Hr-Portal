<style>
  .dashboard {
    padding: 20px;
  }

  .card-container {
    display: flex;
    gap: 20px;
    margin-top: 20px;
    flex-wrap: wrap;
  }

  .card {
    flex: 1 1 250px;
    background-color: #ffffff;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
  }

  .card h3 {
    margin-top: 0;
    color: #2b6cb0;
  }

  .charts-row {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    margin-top: 40px;
  }

  .chart-container {
    flex: 1 1 45%;
    background-color: #ffffff;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    min-width: 300px;
  }

  canvas {
    width: 100% !important;
    max-height: 400px;
  }
</style>

<div class="dashboard">
  <h2>Welcome to the Dashboard</h2>
  <p>This is your central hub. From here you can navigate to other sections of the application.</p>

 <!-- <div class="card-container">
    <div class="card">
      <h3>Requisitions</h3>
      <p>Manage hiring requests and positions.</p>
    </div>
    <div class="card">
      <h3>Repository</h3>
      <p>View candidate data and reports.</p>
    </div>
    <div class="card">
      <h3>User Management</h3>
      <p>Manage users, roles, and access (Admins only).</p>
    </div>
  </div> -->

  <!-- Charts Row -->
  <div class="charts-row">
    <!-- Chart 1: Department-wise -->
    <div class="chart-container">
      <h3>Openings vs. Filled Positions by Department</h3>
      <canvas id="openingsChart"></canvas>
    </div>

    <!-- Chart 2: Assigned To-wise -->
    <div class="chart-container">
      <h3>Openings vs. Filled Positions by HR</h3>
      <canvas id="assignedChart"></canvas>
    </div>
  </div>
</div>

<!-- Chart.js Script -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
  fetch("/dashboard_data")
    .then(response => response.json())
    .then(data => {
      // Chart 1: Department-wise
      const ctx1 = document.getElementById('openingsChart').getContext('2d');
      new Chart(ctx1, {
        type: 'bar',
        data: {
          labels: data.departments,
          datasets: [
            {
              label: 'Total Openings',
              data: data.openings,
              backgroundColor: 'rgba(54, 162, 235, 0.7)'
            },
            {
              label: 'Openings Filled',
              data: data.filled,
              backgroundColor: 'rgba(75, 192, 192, 0.7)'
            }
          ]
        },
        options: {
          responsive: true,
          plugins: {
            title: {
              display: true,
              text: 'Department-wise Openings vs. Filled Positions',
              font: { size: 16 }
            }
          },
          scales: {
            y: {
              beginAtZero: true,
              title: {
                display: true,
                text: 'No. of Positions'
              }
            }
          }
        }
      });

      // Chart 2: Assigned To-wise
      const ctx2 = document.getElementById('assignedChart').getContext('2d');
      new Chart(ctx2, {
        type: 'bar',
        data: {
          labels: data.assigned_to,
          datasets: [
            {
              label: 'Total Openings',
              data: data.assigned_openings,
              backgroundColor: 'rgba(255, 159, 64, 0.7)'
            },
            {
              label: 'Openings Filled',
              data: data.assigned_filled,
              backgroundColor: 'rgba(153, 102, 255, 0.7)'
            }
          ]
        },
        options: {
          responsive: true,
          plugins: {
            title: {
              display: true,
              text: 'Assigned To: Openings vs. Filled Positions',
              font: { size: 16 }
            }
          },
          scales: {
            y: {
              beginAtZero: true,
              title: {
                display: true,
                text: 'No. of Positions'
              }
            }
          }
        }
      });
    })
    .catch(error => console.error('Error fetching chart data:', error));
</script>
