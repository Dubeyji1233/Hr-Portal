<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home | Manpower App</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            background-color: #f4f6f8;
        }

        .top-bar {
            height: 60px;
            background-color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
        }

        .top-bar .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #333;
            font-size: 14px;
        }

        .top-bar .user-info img {
            height: 35px;
            border-radius: 50%;
        }

        .sidebar {
            position: fixed;
            top: 60px;
            left: 0;
            width: 220px;
            height: calc(100% - 60px);
            background-color: #2b6cb0;
            color: white;
            padding: 20px 0;
        }

        .sidebar .logo {
            text-align: center;
            padding-bottom: 20px;
        }

        .sidebar .logo img {
            max-height: 60px;
        }

        .sidebar a {
            display: block;
            padding: 12px 20px;
            color: white;
            text-decoration: none;
        }

        .sidebar a:hover {
            background-color: #1e4d8b;
        }

        .main-content {
            margin-left: 220px;
            padding: 40px;
        }

        .main-content h2 {
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group label {
            width: 150px;
            font-weight: 600;
        }

        .form-group input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .submit-btn {
            background-color: #0078D4;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
        }

        .submit-btn:hover {
            background-color: #005A9E;
        }
    </style>
</head>
<body>

    <div class="top-bar">
    <div><strong>Manpower Portal</strong></div>

        <div class="user-info">
            <span>{{ session['user']['email'] }}</span>
            <span>{{ session['user']['role'] }}</span>
            <img src="{{ url_for('static', filename='avatar.png') }}" alt="User">
        </div>
    </div>

    <div class="sidebar">
        <div class="logo">
            <img src="{{ url_for('static', filename='Company Logo.png') }}" alt="Company Logo">
        </div>
        <a href="#">Request Requisition</a>

    </div>

    <div class="main-content">
        <h2>Request Requisition</h2>
        <form method="POST" action="/submit-requisition">
            <div class="form-group">
                <label for="position">Position</label>
                <input type="text" id="position" name="position" required>
            </div>
            <div class="form-group">
                <label for="location">Location</label>
                <input type="text" id="location" name="location" required>
            </div>
            <div class="form-group">
                <label for="count">Number of Vacancies</label>
                <input type="number" id="count" name="count" required>
            </div>
            <button type="submit" class="submit-btn">Submit Request</button>
        </form>
    </div>

</body>
</html>
